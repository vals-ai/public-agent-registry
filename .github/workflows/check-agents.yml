name: Check agents

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-agents-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check agents against upstream
        run: uv run python scripts/check_agents.py

  release:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Tag new agent versions
        run: |
          for contract in agents/*/contract.yaml; do
            agent="$(dirname "$contract")"
            tag="$(basename "$agent")/v$(jq -r .version "$agent/upstream.json")"
            if ! git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
              git tag "$tag"
              git push origin "refs/tags/$tag"
            fi
          done
