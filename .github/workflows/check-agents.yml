name: Check agents

# Runs scripts/check_agents.py on every pull request and on main. No upstream repo is cloned
# (opencode's history alone is about 620 MB); check_agents.py reads their pinned commits from the
# index.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-agents-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash -eo pipefail: a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5" # the uv that the agents' setup.sh installs

      - name: Install dependencies
        run: uv sync --locked

      - name: Check agents against upstream
        run: uv run python scripts/check_agents.py
