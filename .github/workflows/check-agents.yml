name: Check agents

# Runs the registry's unit tests and scripts/check_agents.py on every pull request and on main.
# Only the Terminus 2 submodule (Harbor) is fetched, and shallow: the tests that need Harbor's
# source import it from there. The other upstream repos are never cloned (opencode's history alone
# is about 620 MB); check_agents.py reads their pinned commits from the index.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-agents-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Fetch Harbor
        run: git submodule update --init --depth 1 agents/terminus2/harbor

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync

      - name: Unit tests
        run: uv run pytest -q

      - name: Terminus 2 tests against Harbor
        env:
          # Keep litellm from fetching its model price map over the network.
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: uv run --with ./agents/terminus2/harbor pytest -q tests/agents/test_terminus2_local_env.py

      - name: Check agents against upstream
        run: uv run python scripts/check_agents.py
