[project]
name = "public-agent-registry-tools"
version = "0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false
required-version = ">=0.13.5"
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
