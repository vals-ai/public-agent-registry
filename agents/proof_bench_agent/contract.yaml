name: proof_bench_agent
install_cmd: bash setup.sh
run_cmd: >-
  bash -lc 'set -o pipefail && mkdir -p /logs &&
  uv run --project /bundle/proof_bench_agent python /bundle/proof_bench_agent/run.py
  --model {model} --problem-file {problem_statement_path} --task-id {task_id}
  --output /workspace/result.json --lean-project /workspace 2>&1 | tee /logs/proof_bench_agent.log;
  cp -f /workspace/result.json /logs/result.json 2>/dev/null || true'
final_output: /logs
output_artifacts:
  - path: vals_format/config.json
    source: /logs/*/turns/init/config.json
  - path: vals_format/result.json
    source: /logs/*/result.json
ingest_lambda: analysis-proof-bench
defaults:
  model:
    type: str
    required: true
secrets:
  POOLSIDE_API_KEY: prodBenchmarksInfraApiKeys
  OPENAI_API_KEY: prodBenchmarksInfraApiKeys
  GOOGLE_API_KEY: prodBenchmarksInfraApiKeys
  COHERE_API_KEY: prodBenchmarksInfraApiKeys
  ANTHROPIC_API_KEY: prodBenchmarksInfraApiKeys
  MISTRAL_API_KEY: prodBenchmarksInfraApiKeys
  XAI_API_KEY: prodBenchmarksInfraApiKeys
  AI21LABS_API_KEY: prodBenchmarksInfraApiKeys
  FIREWORKS_API_KEY: prodBenchmarksInfraApiKeys
  DEEPSEEK_KEY: prodBenchmarksInfraApiKeys
  AZURE_API_KEY: prodBenchmarksInfraApiKeys
  DASHSCOPE_API_KEY: prodBenchmarksInfraApiKeys
  PERPLEXITY_KEY: prodBenchmarksInfraApiKeys
  ZAI_API_KEY: prodBenchmarksInfraApiKeys
  KIMI_API_KEY: prodBenchmarksInfraApiKeys
  MERCURY_KEY: prodBenchmarksInfraApiKeys
  MINIMAX_API_KEY: prodBenchmarksInfraApiKeys
  DEEPSEEK_API_KEY: prodBenchmarksInfraApiKeys
  ARCEE_API_KEY: prodBenchmarksInfraApiKeys
  META_API_KEY: prodBenchmarksInfraApiKeys
  MODEL_PROXY_SSH_KEY: model_proxy_ssh
